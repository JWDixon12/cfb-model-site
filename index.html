<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JWDixon's CFB Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F5;--card:#FFFFFF;--ink:#13213A;--ink-2:#3B4A6B;--muted:#6B7690;--line:#D9DEE8;--gold:#E3A400;--gold-2:#FFF3CC;--green:#0E7A56;--green-2:#DDF3EA;--red:#BE1E2D;--red-2:#FBE3E5;--navy:#0B1630;--radius:12px;--shadow:0 1px 2px rgba(19,33,58,.06),0 10px 30px -14px rgba(19,33,58,.25);--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%}
.logo{width:34px;height:34px;object-fit:contain;flex:none;display:inline-block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.logo.sm{width:24px;height:24px}.logo.lg{width:72px;height:72px}
header{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 60px);pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:26px 0 18px;flex-wrap:wrap}
.hero h1{font:800 44px/0.95 var(--display);letter-spacing:.5px;margin:0;text-transform:uppercase}
.hero h1 span{color:var(--gold)}
.hero .sub{color:#B8C2DA;font-size:13px;margin-top:8px}
.hero .stamp{font:700 13px var(--display);letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(227,164,0,.5);padding:6px 10px;border-radius:999px}
nav{position:sticky;top:0;z-index:20;background:rgba(11,22,48,.96);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{font:700 15px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:#C9D2E6;text-decoration:none;padding:14px 16px;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:#fff;border-color:var(--gold)}
main{padding:22px 0 60px}
section{display:none}section.on{display:block}
h2{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 12px;display:flex;align-items:baseline;gap:12px}
h2 small{font:600 13px var(--body);color:var(--muted);letter-spacing:0;text-transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.toolbar input,.toolbar select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{font:700 14px var(--display);letter-spacing:1px;text-transform:uppercase;padding:9px 14px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.note{color:var(--muted);font-size:13px}
/* slate */
.day{font:700 15px var(--display);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.game{padding:10px 14px 12px}
.gh{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.gh b{color:var(--ink-2);font-weight:600;white-space:nowrap}
.gh span{text-align:right;min-width:0}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.side .nm{font:700 18px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.side .wp{font-size:12px;color:var(--muted)}
.side.win .nm{color:var(--green)}
.score{font:800 34px/1 var(--display);text-align:center;min-width:96px;font-variant-numeric:tabular-nums}
.score small{display:block;font:600 10.5px var(--body);color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.bar{height:5px;border-radius:999px;background:var(--red-2);overflow:hidden;display:flex;margin:8px 0 10px}
.bar i{display:block;height:100%;background:var(--green)}
.bar.h{background:var(--line)}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.stats3 div{background:var(--paper);border-radius:8px;padding:6px 4px}
.stats3 span{display:block;font:700 10.5px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.stats3 b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.stats3 i{font-style:normal;color:var(--muted);font-weight:500}
/* picks */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.play{padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.play .top{display:flex;align-items:center;gap:12px}
.play .pick{font:800 26px/1 var(--display);text-transform:uppercase}
.play .pick b{color:var(--green)}
.play .meta{font-size:12.5px;color:var(--muted)}
.play .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--gold-2);color:#7A5600;border:1px solid #F1D98A}
.chip.ml{background:var(--green-2);color:var(--green);border-color:#BFE6D5}
.play .nums{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.play .nums b{color:var(--ink);font-weight:700}
.badge{position:absolute;top:12px;right:14px;font:800 14px var(--display);letter-spacing:1px;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.badge.W{background:var(--green);color:#fff}.badge.L{background:var(--red);color:#fff}.badge.P{background:var(--gold);color:#3a2b00}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font:700 13px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;background:var(--card)}
th.on{color:var(--ink)}
td.rk{font:800 20px var(--display);width:44px}
.tm{display:flex;align-items:center;gap:10px;font-weight:600}
.tm a{text-decoration:none}.tm a:hover{text-decoration:underline}
.mv{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.mv.up{background:var(--green-2);color:var(--green)}.mv.dn{background:var(--red-2);color:var(--red)}.mv.same{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
tr.total td{font-weight:700;border-top:2px solid var(--ink);background:var(--paper)}
.pos{color:var(--green)}.neg{color:var(--red)}
/* teams */
.teamhead{display:flex;align-items:center;gap:18px;padding:18px 20px;flex-wrap:wrap}
.teamhead h3{font:800 38px/1 var(--display);text-transform:uppercase;margin:0}
.teamhead .kv{display:flex;gap:22px;flex-wrap:wrap;margin-left:auto}
.kv div{text-align:center}.kv b{display:block;font:800 26px/1 var(--display)}.kv span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.sched{margin-top:14px}
.gm{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:0}
.gm .wk{font:700 13px var(--display);letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.gm .wk b{display:block;font-size:18px;color:var(--ink)}
.gm .opp{display:flex;align-items:center;gap:10px;min-width:0}
.gm .opp .nm{font:700 18px/1.05 var(--display);text-transform:uppercase}
.gm .opp .at{font-size:12px;color:var(--muted)}
.gm .res{text-align:right}
.gm .res b{font:800 22px/1 var(--display)}
.gm .res span{display:block;font-size:11.5px;color:var(--muted)}
.gm.w .res b{color:var(--green)}.gm.l .res b{color:var(--red)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--ink-2);margin-left:6px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:8px;padding:8px 10px;text-decoration:none;font:700 15px var(--display);text-transform:uppercase;cursor:pointer}
.tile:hover{border-color:var(--gold)}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:8px}
.stat{padding:14px 16px}
.stat b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
.stat i{font-style:normal;font-size:12px;color:var(--ink-2)}
footer{color:var(--muted);font-size:12px;padding:20px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.hero h1{font-size:36px}.games{grid-template-columns:1fr}.side .nm{font-size:16px}.score{font-size:28px;min-width:76px}.logo{width:28px;height:28px}th,td{padding:8px 6px;font-size:13px}.teamhead h3{font-size:30px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  <section id="teams">

  <section id="stats">

  </section>
  <footer id="foot"></footer>
</main>

const $ = (s, el=document) => el.querySelector(s), $$ = (s, el=document) => [...el.querySelectorAll(s)];
const logo = id => !id ? "" : D.logos ? (D.logos[String(id)] || "") : D.logo.replace("{id}", id);
const pct = p => p == null ? "" : Math.round(100*p) + "%";
const sp = v => v == null ? "—" : v === 0 ? "PK" : (v > 0 ? "+" : "") + v.toFixed(1);
const tot = v => v == null ? "—" : v.toFixed(1);
const ml = v => v == null ? "" : (v > 0 ? "+" : "") + v;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = (id, cls="logo") => { const s = logo(id); return s ? `<img class="${cls}" src="${s}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="${cls}"></span>`; };
const units = u => (u > 0 ? "+" : "") + u.toFixed(2) + "u";
let wk = D.weeks[0].week, pwk = D.weeks[0].week;

$("#sub").textContent = `${D.season} season · refreshed ${D.updated}`;
$("#stamp").textContent = `Week ${D.week}`;
$("#foot").textContent = `JWDixon's CFB Model · ratings through week ${D.powerWeek} · updated ${D.updated} · lines are consensus book numbers at refresh time`;

function route(){
  const h = location.hash || "#week";
  const [tab, arg] = h.slice(1).split("=");
  const tabs = ["week","picks","power","teams","stats"];
  const on = tab === "team" ? "teams" : (tabs.includes(tab) ? tab : "week");
  $$("section").forEach(s => s.classList.toggle("on", s.id === on));
  $$("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === on));
  if (tab === "team" && arg) showTeam(decodeURIComponent(arg));
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);

function seg(el, cur, onpick){
  el.innerHTML = D.weeks.map(w => `<button class="${w.week===cur?'on':''}" data-w="${w.week}">Week ${w.week}</button>`).join("");
  $$("button", el).forEach(b => b.onclick = () => onpick(+b.dataset.w));
}

/* ---------- this week ---------- */
function renderWeek(){
  seg($("#weekseg"), wk, w => { wk = w; renderWeek(); });
  const W = D.weeks.find(w => w.week === wk);
  $("#weeknote").textContent = W.preview ? "preview — lines and ratings will move before kickoff" : "";
  let day = "", html = "";
  W.slate.forEach((g, i) => {
    if (g.day !== day) { if (day) html += `</div>`; day = g.day; html += `<div class="day">${esc(day)}</div><div class="games">`; }
    const hp = g.homeProb, ap = hp == null ? null : 1 - hp, hw = hp != null && hp >= 0.5;
    const where = [g.venue, g.loc].filter(Boolean).join(" · ");
    html += `<div class="card game">
      <div class="gh"><b>${esc(g.kick)}</b><span>${esc(where)}${g.neutral ? " · neutral site" : ""}</span></div>
      <div class="teams">
        <div class="side ${hw?'':'win'}">${img(g.awayId)}<div class="nm">${esc(g.away)}</div><div class="wp">${pct(ap)} win · ${ml(g.awayML)}</div></div>
        <div class="score">${g.awayScore ?? "–"}<span style="color:var(--muted)"> – </span>${g.homeScore ?? "–"}<small>projected</small></div>
        <div class="side ${hw?'win':''}">${img(g.homeId)}<div class="nm">${esc(g.home)}</div><div class="wp">${pct(hp)} win · ${ml(g.homeML)}</div></div>
      </div>
      <div class="bar ${hp==null?'h':''}"><i style="width:${hp==null?0:Math.round(100*(1-hp))}%"></i></div>
      <div class="stats3">
        <div><span>Our line</span><b>${esc(g.home)} ${sp(g.modelSpread)}</b></div>
        <div><span>Market</span><b>${g.mktSpread == null ? "no line" : esc(g.home) + " " + sp(g.mktSpread)}</b></div>
        <div><span>Total</span><b>${tot(g.modelTotal)} <i>· mkt ${tot(g.mktTotal)}</i></b></div>
      </div>
    </div>`;
  });
  if (day) html += `</div>`;
  $("#slate").innerHTML = html || `<p class="note">No FBS games on the slate.</p>`;
}

/* ---------- my picks ---------- */
function stars(n){ return "★".repeat(n) + "☆".repeat(3-n); }
function playCard(p, recorded){
  const badge = p.result ? `<span class="badge ${p.result}">${p.result}${p.final ? " · " + esc(p.final) : ""}</span>` : (recorded ? `<span class="badge">pending</span>` : "");
  const line = p.type === "spread" ? esc(p.label) : `ML ${esc(p.label)}`;
  return `<div class="card play">${badge}
    <div class="top">${img(p.pickId)}<div><div class="pick"><b>${esc(p.pick)}</b> ${line}</div>
    <div class="meta">${esc(p.away)} @ ${esc(p.home)} · ${esc(p.kick)}</div></div></div>
    <div class="chips">${p.why.map(w => `<span class="chip ${p.type==='moneyline'?'ml':''}">${esc(w)}</span>`).join("")}<span class="stars" title="strength">${stars(p.strength)}</span></div>
    <div class="nums"><span>our line <b>${esc(p.home)} ${sp(p.modelLine)}</b></span><span>market <b>${esc(p.home)} ${sp(p.mktLine)}</b></span>
      ${p.type === "spread" ? `<span>edge <b>${p.edge} pts</b></span>` : `<span>model win <b>${pct(p.prob)}</b></span><span>edge <b>+${p.edge} pts</b></span>`}
      ${p.recorded ? `<span>logged <b>${esc(p.recorded)}</b></span>` : ""}</div>
  </div>`;
}
function renderPicks(){
  seg($("#pickseg"), pwk, w => { pwk = w; renderPicks(); });
  const W = D.weeks.find(w => w.week === pwk);
  const logged = D.ledger.picks.filter(p => p.week === pwk);
  const list = logged.length ? logged : W.board;
  const s = D.ledger.summary.weeks.find(x => x.week === pwk);
  $("#picknote").textContent = W.preview && !logged.length ? "preview — picks are logged once the week starts" :
    (s && s.graded ? `${s.w}-${s.l}${s.p ? "-" + s.p : ""} · ${units(s.units)}` : `${list.length} picks`);
  const order = {spread: 0, moneyline: 1};
  list.sort((a, b) => (a.iso || "").localeCompare(b.iso || "") || order[a.type] - order[b.type]);
  $("#board").innerHTML = list.length ? list.map(p => playCard(p, logged.length > 0)).join("") : `<p class="note">No picks this week.</p>`;
}

/* ---------- power ---------- */
let psort = {k:"rank", asc:true};
function renderPower(){
  $("#powernote").textContent = `neutral-field strength through week ${D.powerWeek} · click a column to sort`;
  const confs = [...new Set(D.power.map(r => r.conf))].sort();
  if ($("#pconf").options.length === 1) confs.forEach(c => $("#pconf").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
  const q = $("#psearch").value.trim().toLowerCase(), cf = $("#pconf").value;
  let rows = D.power.filter(r => (!q || r.team.toLowerCase().includes(q)) && (!cf || r.conf === cf));
  rows.sort((a,b) => { const x=a[psort.k], y=b[psort.k]; const c = typeof x === "number" ? x-y : String(x).localeCompare(String(y)); return psort.asc ? c : -c; });
  $$("#ptable th").forEach(th => th.classList.toggle("on", th.dataset.k === psort.k));
  $("#ptable tbody").innerHTML = rows.map(r => {
    const mv = r.move == null ? "" : r.move > 0 ? `<span class="mv up">▲${r.move}</span>` : r.move < 0 ? `<span class="mv dn">▼${-r.move}</span>` : `<span class="mv same">–</span>`;
    return `<tr><td class="rk">${r.rank}</td><td><span class="tm">${img(D.teams[r.team]?.id,"logo sm")}<a href="#team=${encodeURIComponent(r.team)}">${esc(r.team)}</a>${mv}</span></td>
      <td>${esc(r.conf)}</td><td class="num">${r.power?.toFixed(1)}</td><td class="num">${r.off?.toFixed(1)}</td><td class="num">${r.def?.toFixed(1)}</td>
      <td>${esc(r.recordNow)}</td><td><b>${esc(r.projRecord)}</b></td></tr>`;
  }).join("");
}
$$("#ptable th").forEach(th => th.onclick = () => { const k = th.dataset.k; psort = {k, asc: psort.k === k ? !psort.asc : (k === "rank" || k === "team" || k === "conf")}; renderPower(); });
$("#psearch").oninput = renderPower; $("#pconf").onchange = renderPower;

/* ---------- teams ---------- */
const names = Object.keys(D.teams).sort((a,b) => (D.teams[a].rank ?? 999) - (D.teams[b].rank ?? 999));
$("#tlist").innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
$("#tiles").innerHTML = names.map(n => `<a class="card tile" href="#team=${encodeURIComponent(n)}">${img(D.teams[n].id,"logo sm")}<span>${D.teams[n].rank ? D.teams[n].rank + ". " : ""}${esc(n)}</span></a>`).join("");
$("#tsearch").addEventListener("change", e => { if (D.teams[e.target.value]) location.hash = "#team=" + encodeURIComponent(e.target.value); });
function showTeam(name){
  const t = D.teams[name]; if (!t) { $("#team").innerHTML = ""; $("#tiles").style.display = ""; return; }
  $("#tiles").style.display = "none";
  const mv = t.prevRank && t.rank ? t.prevRank - t.rank : null;
  $("#team").innerHTML = `<div class="card teamhead">${img(t.id,"logo lg")}<div><h3>${esc(name)}</h3><div class="note">${esc(t.conf)}${t.rank?` · #${t.rank} in the power rankings${mv?(mv>0?` <span class="mv up">▲${mv}</span>`:` <span class="mv dn">▼${-mv}</span>`):""}`:""}</div></div>
    <div class="kv"><div><b>${esc(t.recordNow||"–")}</b><span>record</span></div><div><b>${esc(t.projRecord||"–")}</b><span>projected</span></div><div><b>${t.expWins??"–"}</b><span>exp. wins</span></div><div><b>${t.power??"–"}</b><span>power</span></div><div><b>${t.off??"–"}</b><span>off</span></div><div><b>${t.def??"–"}</b><span>def</span></div></div></div>
    <div class="card sched">${t.schedule.map(g => {
      const cls = g.final ? (g.us > g.them ? "w" : "l") : "";
      const where = g.neutral ? "vs" : g.home ? "vs" : "at";
      const place = [g.venue, g.loc].filter(Boolean).join(" · ");
      return `<div class="gm ${cls}"><div class="wk">Week<b>${g.week}</b></div>
        <div class="opp">${img(g.oppId)}<div><div class="nm"><span class="at">${where}</span> <a href="#team=${encodeURIComponent(g.opp)}" style="text-decoration:none">${esc(g.opp)}</a>${g.oppClass!=='fbs'?'<span class="pill">'+g.oppClass.toUpperCase()+'</span>':''}${g.neutral?'<span class="pill">N</span>':''}</div><div class="at">${esc(g.day)}${place ? " · " + esc(place) : ""}</div></div></div>
        <div class="res"><b>${g.final ? (g.us>g.them?"W":"L")+" " : ""}${g.us ?? "–"}–${g.them ?? "–"}</b><span>${g.final ? "final" : "proj · " + pct(g.prob) + " to win"}</span></div></div>`;
    }).join("")}</div>
    <p><a href="#teams" onclick="document.getElementById('tiles').style.display='';document.getElementById('team').innerHTML=''">← all teams</a></p>`;
}

/* ---------- stats ---------- */
function tile(b, s, i){ return `<div class="card stat"><b>${b}</b><span>${s}</span>${i ? `<br><i>${i}</i>` : ""}</div>`; }
function renderStats(){
  const B = D.stats.backtest, S = D.stats.season, T = D.ledger.summary;
  $("#btnote").textContent = `${B.label} · ${B.games.toLocaleString()} lined FBS games, out of sample`;
  $("#bt").innerHTML = tile(B.marginMAE.toFixed(2), "Margin MAE (points)") + tile(B.marketMAE.toFixed(2), "Closing line MAE") + tile(B.su.toFixed(1) + "%", "Straight-up", `closing line ${B.mktSu.toFixed(1)}%`);
  $("#seasonhead").innerHTML = `${D.season} so far <small>${S.games ? S.games + " completed lined FBS games" : "no completed lined games yet — fills in after the first weekend"}</small>`;
  $("#st").innerHTML = S.games ? tile(S.marginMAE.toFixed(2), "Margin MAE (points)") + tile(S.marketMAE.toFixed(2), "Closing line MAE") + tile(S.su.toFixed(1) + "%", "Straight-up", `closing line ${S.mktSu.toFixed(1)}%`)
    + (S.ats3 ? tile(`${S.ats3.w}-${S.ats3.l}${S.ats3.p ? "-" + S.ats3.p : ""}`, "ATS when edge ≥ 3", `${S.ats3.pct}%`) : "") : "";
  const t = T.total, rec = `${t.w}-${t.l}${t.p ? "-" + t.p : ""}`;
  $("#trk").innerHTML = tile(rec, "Record (W-L" + (t.p ? "-P" : "") + ")", `${t.picks} picks logged`) + tile(units(t.units), "Units", t.graded ? "" : "nothing graded yet")
    + tile(t.roi == null ? "—" : (t.roi > 0 ? "+" : "") + t.roi + "%", "ROI", "units won per pick");
  $("#ttable tbody").innerHTML = T.weeks.map(w => `<tr><td>Week ${w.week}</td><td class="num">${w.picks}</td><td class="num">${w.w}</td><td class="num">${w.l}</td><td class="num">${w.p}</td>
    <td class="num ${w.units>0?'pos':w.units<0?'neg':''}">${w.graded ? units(w.units) : "—"}</td><td class="num">${w.roi == null ? "—" : (w.roi > 0 ? "+" : "") + w.roi + "%"}</td></tr>`).join("")
    + `<tr class="total"><td>Total</td><td class="num">${t.picks}</td><td class="num">${t.w}</td><td class="num">${t.l}</td><td class="num">${t.p}</td><td class="num ${t.units>0?'pos':t.units<0?'neg':''}">${t.graded ? units(t.units) : "—"}</td><td class="num">${t.roi == null ? "—" : (t.roi > 0 ? "+" : "") + t.roi + "%"}</td></tr>`;
}

renderWeek(); renderPicks(); renderPower(); renderStats(); route();
</script>
</body>
</html>
